# Central nightly sync of the project field Needs for every item of the project, across all repositories, a caller of the
# reusable workflow issues.yml of GravionLabs/ci (mode project). Run it in ONE repository per project (GravionLabs/ci does);
# other repositories need only issue-events.yml. Replace <owner> and <n> in project-url.
# Inputs and token requirements: see the GravionLabs/ci README (issues.yml, project/needs).
# PROJECT_TOKEN (classic PAT with scope `project`; GH_PAT is the deprecated fallback). No token: a warning and a green job.
name: Project needs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  needs:
    # GitHub validates every job of issues.yml at startup; its conventions job requests issues: write.
    permissions:
      issues: write
    uses: GravionLabs/ci/.github/workflows/issues.yml@v1
    with:
      project-url: https://github.com/users/<owner>/projects/<n>
      needs: true
      mode: project
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
