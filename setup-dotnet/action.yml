name: 'Setup .NET'
description: 'Sets up .NET SDK, NuGet package cache, and an optional private NuGet feed (GitHub Packages, Azure Artifacts, JFrog)'

inputs:
  dotnet-version:
    description: 'Version of .NET SDK to use (e.g. 8.x, 9.x, 10.x)'
    required: false
    default: '10.x'
  feed-url:
    description: 'URL of the private NuGet feed (GitHub Packages, Azure Artifacts, JFrog Artifactory)'
    required: false
    default: ''
  feed-name:
    description: 'Name to register the private feed as'
    required: false
    default: 'private-feed'
  feed-username:
    description: 'Username for the private feed (e.g. GitHub username, Azure DevOps username, JFrog username)'
    required: false
    default: ''
  feed-token:
    description: 'Access token or PAT for the private feed (e.g. GitHub PAT, Azure DevOps PAT, JFrog API key)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-packages-${{ runner.os }}-${{ hashFiles('**/*.csproj','**/packages.lock.json') }}
          restore-keys: |
            nuget-packages-${{ runner.os }}-

      - name: Add private NuGet feed
        if: ${{ inputs.feed-url != '' }}
        shell: bash
        run: |
          dotnet nuget add source "${{ inputs.feed-url }}" \
            --name "${{ inputs.feed-name }}" \
            --username "${{ inputs.feed-username }}" \
            --password "${{ inputs.feed-token }}" \
            --store-password-in-clear-text
