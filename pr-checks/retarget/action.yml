name: PR retarget
description: >-
  Moves a pull request from a work branch (`feat|refactor|chore|docs|test|perf|build|ci/<nr>-…`) of the same
  repository that targets the default branch to the release branch (default `release/next`) and comments on it.
  `release/**` and `fix/**` PRs stay. Fails with a hint when the release branch does not exist.
  Run it on `pull_request`; the token needs `pull-requests: write`. Title and body are never read.

inputs:
  release-branch:
    description: Branch that work-branch PRs are moved to
    required: false
    default: release/next
  token:
    description: Token with pull-requests write access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        RELEASE_BRANCH: ${{ inputs.release-branch }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { default: run } = await import(`${process.env.ACTION_PATH}/run.mjs`);
          await run({ github, context, core, inputs: { releaseBranch: process.env.RELEASE_BRANCH } });
