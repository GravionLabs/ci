name: PR persistence
description: >-
  Fails a pull request whose added lines install background persistence: Windows scheduled tasks, Run/RunOnce
  registry keys, autostart libraries and login items, Windows services, macOS LaunchAgents/LaunchDaemons, systemd
  user units and timers, cron entries, and installer scripts (NSIS, WiX) that start PowerShell or another script
  host. Markdown files are not scanned. A file passes when it contains `persistence-allowed: <path>` naming an ADR
  with `Status: Accepted` on the base branch (the file itself is read from the head of the PR). Run it on `pull_request`; the token needs `contents: read` and
  `pull-requests: read`.

inputs:
  token:
    description: Token with contents and pull-requests read access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { default: run } = await import(`${process.env.ACTION_PATH}/run.mjs`);
          await run({ github, context, core });
