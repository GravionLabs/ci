name: 'Deploy GitHub Pages (MkDocs)'
description: 'Deprecated: use the reusable workflow vitepress-pages.yml (removal in the next major). Builds a MkDocs site with the Material theme and uploads it as a GitHub Pages artifact.'

inputs:
  docs-path:
    description: 'Path to the docs directory (relative to workspace root)'
    required: false
    default: 'docs'
  mkdocs-config-file:
    description: 'Path to the mkdocs.yml configuration file'
    required: false
    default: 'mkdocs.yml'
  python-version:
    description: 'Python version to use for building the docs'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - name: Configure GitHub Pages
      uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install MkDocs Material
      shell: bash
      run: pip install mkdocs-material

    - name: Build MkDocs site
      shell: bash
      run: mkdocs build --config-file ${{ inputs.mkdocs-config-file }} --site-dir _site

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
      with:
        path: _site
