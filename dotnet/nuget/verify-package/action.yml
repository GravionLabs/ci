name: 'Verify NuGet Package Contents'
description: |
  Inspects a packed .nupkg file and asserts that all expected paths are present.
  Must be called in the same job as the pack action so that ./nupkgs/ is already populated.

inputs:
  files:
    description: |
      Newline-separated list of file paths that must exist inside the .nupkg.
      Example:
        lib/net8.0/MyLib.dll
        lib/net10.0/MyLib.xml
        README.md
    required: true

runs:
  using: 'composite'
  steps:
    - name: Verify package contents
      shell: bash
      env:
        EXPECTED_FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail

        # Use glob directly instead of ls to avoid word-splitting issues
        pkgs=( ./nupkgs/*.nupkg )
        if [[ ! -e "${pkgs[0]}" ]]; then
          echo "::error::No .nupkg found in ./nupkgs/" >&2
          exit 1
        fi
        if [[ ${#pkgs[@]} -gt 1 ]]; then
          echo "::warning::Multiple .nupkg files found; verifying only ${pkgs[0]}"
        fi
        pkg="${pkgs[0]}"

        echo "Inspecting: $pkg"
        # unzip -Z1 lists only filenames (one per line), avoiding header/metadata noise from unzip -l
        file_list=$(unzip -Z1 "$pkg")
        echo "$file_list"
        echo ""

        failed=0
        while IFS= read -r pattern; do
          # Skip empty lines
          [[ -z "$pattern" ]] && continue

          # Strip potential CRLF from pattern, use -F (fixed string) and -x (exact line match)
          # to prevent false positives (e.g. README.md matching READMExmd) and -- to guard against
          # patterns starting with -
          pattern="${pattern//$'\r'/}"
          if echo "$file_list" | grep -Fxq -- "$pattern"; then
            echo "  OK: $pattern"
          else
            echo "::error::Missing expected file in package: $pattern" >&2
            failed=1
          fi
        done <<< "$EXPECTED_FILES"

        if [[ $failed -ne 0 ]]; then
          exit 1
        fi

        echo "All expected package contents verified."
