name: 'Test .NET'
description: 'Runs .NET unit tests with Coverlet code coverage collection'

inputs:
  test-project:
    description: 'Path or glob for the .NET test projects to run (e.g. test/**/*.Test.csproj)'
    required: false
    default: 'test/**/*.Test.csproj'
  configuration:
    description: 'Build configuration (e.g. Debug or Release)'
    required: false
    default: 'Release'
  coverage-format:
    description: 'Coverage report format (cobertura, opencover, lcov, json)'
    required: false
    default: 'cobertura'
  upload-results:
    description: 'Whether to upload test results and coverage report as artifacts'
    required: false
    default: 'true'
  verbosity:
    description: 'Verbosity level (quiet, minimal, normal, detailed, diagnostic)'
    required: false
    default: 'minimal'

runs:
  using: 'composite'
  steps:
      - name: Generate coverage runsettings
        shell: bash
        run: |
          cat > /tmp/coverage.runsettings << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <DataCollectionRunSettings>
              <DataCollectors>
                <DataCollector friendlyName="XPlat Code Coverage">
                  <Configuration>
                    <Format>${{ inputs.coverage-format }}</Format>
                  </Configuration>
                </DataCollector>
              </DataCollectors>
            </DataCollectionRunSettings>
          </RunSettings>
          EOF

      - name: Test with coverage
        shell: bash
        run: |
          shopt -s globstar nullglob
          dotnet test ${{ inputs.test-project }} \
            --configuration ${{ inputs.configuration }} \
            --no-build \
            --verbosity ${{ inputs.verbosity }} \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --results-directory ./test-results \
            --settings /tmp/coverage.runsettings

      - name: Upload test results artifact
        if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./test-results/**/coverage.${{ inputs.coverage-format }}.xml
          if-no-files-found: warn
