name: 'Test .NET'
description: 'Runs .NET unit tests with Coverlet code coverage collection'

inputs:
  test-project:
    description: 'Path or glob for the .NET test projects to run (e.g. test/**/*.Test.csproj)'
    required: false
    default: 'test/**/*.Test.csproj'
  configuration:
    description: 'Build configuration (e.g. Debug or Release)'
    required: false
    default: 'Release'
  coverage-format:
    description: 'Coverage report format (cobertura, opencover, lcov, json)'
    required: false
    default: 'cobertura'
  upload-results:
    description: 'Whether to upload test results and coverage report as artifacts'
    required: false
    default: 'true'
  publish-results:
    description: 'Whether to publish test results as a GitHub Check Run and coverage as a job summary'
    required: false
    default: 'true'
  verbosity:
    description: 'Verbosity level (quiet, minimal, normal, detailed, diagnostic)'
    required: false
    default: 'minimal'

runs:
  using: 'composite'
  steps:
      - name: Test with coverage
        shell: bash
        run: |
          shopt -s globstar nullglob
          dotnet test ${{ inputs.test-project }} \
            --configuration ${{ inputs.configuration }} \
            --verbosity ${{ inputs.verbosity }} \
            --logger trx \
            --collect "XPlat Code Coverage;Format=${{ inputs.coverage-format }}" \
            --results-directory ./test-results

      - name: Upload test results artifact
        if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./test-results/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage artifact
        if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ./test-results/**/coverage.${{ inputs.coverage-format }}.xml
          if-no-files-found: warn

      - name: Publish test results
        if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: ./test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Publish coverage summary
        if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./test-results/**/coverage.${{ inputs.coverage-format }}.xml
          badge: true
          fail_below_min: false
          format: markdown
          output: both
