name: 'Lint Dockerfile'
description: 'Lints a Dockerfile using hadolint'

inputs:
  dockerfile:
    description: 'Path to the Dockerfile to lint'
    required: false
    default: 'Dockerfile'
  hadolint-config:
    description: 'Path to a hadolint configuration file (e.g. .hadolint.yaml)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        token: ${{ github.token }}

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
      with:
        dockerfile: ${{ inputs.dockerfile }}
        config: ${{ inputs.hadolint-config != '' && inputs.hadolint-config || '' }}
