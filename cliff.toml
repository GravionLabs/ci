[changelog]
header = """# Changelog

All notable changes to GravionLabs/ci are documented here.
Versioning follows [Semantic Versioning](https://semver.org/).
Callers should pin to a major version tag (e.g. `@v1`) rather than `@main`.

---

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}⚠️ **Breaking**: {% endif -%}
{% if commit.scope %}**{{ commit.scope }}**: {% endif -%}
{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# The squash commit of #166 has its BREAKING CHANGE footer mid-body, so git-cliff does not
# flag it. The owner decided it ships as a v1 minor (#174); mark it in the generated entry.
commit_preprocessors = [
  { pattern = "remove the sprint mode \\(#166\\)", replace = "BREAKING, ships as a minor release: remove the sprint mode (#166)" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^revert", group = "Reverts" },
  { body = ".*security", group = "Security" },
  { message = "^chore|^ci|^style|^test|^build", skip = true },
]
protect_breaking_commits = false
filter_commits = true
# Only consider stable SemVer tags (ignores v0.x pre-release tags like v0.0.1-33)
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
sort_commits = "oldest"
