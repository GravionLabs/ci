name: 'Setup Node.js'
description: 'Sets up a Node.js environment with optional dependency caching'

inputs:
  node-version:
    description: 'The Node.js version to use (e.g. 18, 20, 22)'
    required: false
    default: '20'
  cache:
    description: 'Package manager used for caching dependencies (npm, yarn, or pnpm)'
    required: false
    default: 'npm'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js ${{ inputs.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}

