# This repository's caller of the reusable pr-checks.yml (the file pr-checks.yml itself is workflow_call only).
# Jobs that run: title (the PR title is a Conventional Commit and agrees with the commits) and readiness
# (the PR closes an issue that is ready; release PRs exempt). adr and spec stay off: this repository has no docs/adr/.
# persistence stays off: this repository ships the patterns of that check (pr-checks/persistence) and its tests.
# retarget stays off: PRs of this repository already target release/next (and the action exists at @v1 only after release).
# pull-requests: write is still granted: GitHub validates the permissions of all jobs of the called workflow.
# Turn further checks on here by setting adr / spec to true.
# The job id `pr-checks` makes the required status check "pr-checks / PR checks".
name: PR checks caller

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-checks:
    permissions:
      contents: read
      issues: read
      pull-requests: write
    uses: ./.github/workflows/pr-checks.yml
    with:
      readiness: true
      adr: false
      spec: false
      persistence: false
      retarget: false
