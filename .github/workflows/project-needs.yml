# Central nightly sync of the project field Needs for every item of the project, across all repositories (and on demand),
# through the needs job of the reusable workflow issues.yml in mode project; other repositories need no such workflow. Event-driven syncs run from issue-events.yml.
# Token: PROJECT_TOKEN (classic PAT, scope `project`; a GitHub App cannot write to a user-owned project).
# The job grants issues: write only because GitHub validates the permissions of every job of issues.yml at startup
# (conventions requests it); on schedule/workflow_dispatch only the needs job runs, and it uses permissions: {}.
name: Project needs

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  needs:
    permissions:
      issues: write
    uses: ./.github/workflows/issues.yml
    with:
      project-url: https://github.com/users/GravionLabs/projects/17
      needs: true
      mode: project
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
