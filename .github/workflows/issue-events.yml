# Issue and pull request events of this repository, handled by the reusable workflow issues.yml:
# adds new issues and pull requests to the GravionLabs project (https://github.com/users/GravionLabs/projects/17),
# applies the issue title/section conventions, keeps the project field Needs current (needs job) and sets the project Status
# of a reopened issue to Todo when it is Done (reopen-status job; otherwise "Auto-close issue" of the project closes it again).
# PROJECT_TOKEN is a classic PAT with the scopes `project` and `repo` for add-to-project and the needs job; neither the GITHUB_TOKEN
# nor a GitHub App can write to a user-owned project. The project calls use the REST projectsV2 endpoints where GitHub offers them.
# The GitHub App GravionLabs CI (CI_APP_ID, CI_APP_PRIVATE_KEY) is used by the other workflows (release PR, changelog commit, Renovate).
# pull_request_target: Dependabot and fork PRs get the secrets too; issues.yml never checks out PR code.
# The central nightly Needs sync of all repositories runs from project-needs.yml (mode project).
name: Issue events

on:
  issues:
    types: [opened, reopened, transferred, edited, labeled, unlabeled, closed, milestoned, demilestoned]
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review]

permissions: {}

jobs:
  issues:
    permissions:
      issues: write
    uses: ./.github/workflows/issues.yml
    with:
      project-url: https://github.com/users/GravionLabs/projects/17
      needs: true
    # only the secrets issues.yml needs, not secrets: inherit (pull_request_target runs for fork PRs)
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
