name: Python Package CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use (e.g. 3.12, 3.13, 3.14)'
        type: string
        required: false
        default: '3.14'
      uv-version:
        description: 'uv version to pin (e.g. 0.6.0); omit for latest'
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Directory containing pyproject.toml'
        type: string
        required: false
        default: '.'
      gitversion-config-file:
        description: 'Path to a GitVersion.yml configuration file (optional)'
        type: string
        required: false
        default: ''
      pytest-args:
        description: 'Additional arguments to pass to pytest (e.g. tests/ -k "not slow")'
        type: string
        required: false
        default: ''
      coverage-report:
        description: 'Coverage report format (xml, html, term, term-missing); set to empty to disable coverage'
        type: string
        required: false
        default: 'xml'
      publish-feed-url:
        description: |
          URL of the target package index to publish to. Leave empty to publish to PyPI via Trusted Publishing.
            GitHub Packages:   https://nuget.pkg.github.com/{owner}/
            Azure Artifacts:   https://pkgs.dev.azure.com/{org}/_packaging/{feed}/pypi/upload/
            JFrog Artifactory: https://{domain}/artifactory/api/pypi/{repo}
        type: string
        required: false
        default: ''
      force-publish:
        description: 'Publish regardless of the current branch (e.g. to release pre-release/beta versions from feature branches)'
        type: boolean
        required: false
        default: false
      changelog-file:
        description: 'Path to a CHANGELOG.md file to use for release notes'
        type: string
        required: false
        default: 'CHANGELOG.md'
      cliff-config:
        description: 'Path to a cliff.toml file for git-cliff changelog generation (optional)'
        type: string
        required: false
        default: ''
      update-changelog:
        description: 'When cliff-config is set, regenerate CHANGELOG.md from git history and commit it before the release tag'
        type: boolean
        required: false
        default: false
      release-tag-prefix:
        description: 'Prefix for the release git tag (e.g. "v" → v1.2.3)'
        type: string
        required: false
        default: 'v'
      main-branch:
        description: 'Name of the main branch; packages are only published from this branch'
        type: string
        required: false
        default: 'main'
    secrets:
      publish-api-key:
        description: 'API token for the target feed. Not required when using PyPI Trusted Publishing.'
        required: false

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      python-version: ${{ steps.version.outputs.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: ${{ inputs.gitversion-config-file }}

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: determine-version
    steps:
      - name: Build
        uses: GravionLabs/ci/python/build@main
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          version: ${{ needs.determine-version.outputs.python-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Test
        uses: GravionLabs/ci/python/test@main
        with:
          working-directory: ${{ inputs.working-directory }}
          pytest-args: ${{ inputs.pytest-args }}
          coverage-report: ${{ inputs.coverage-report }}
          upload-results: 'true'

  publish:
    name: Publish
    needs: [determine-version, build-test]
    if: github.ref == format('refs/heads/{0}', inputs.main-branch) || inputs.force-publish == true
    runs-on: ubuntu-latest
    environment: pypi-publish
    permissions:
      id-token: write  # required for PyPI Trusted Publishing
    steps:
      - name: Publish Python package
        uses: GravionLabs/ci/python/pypi/publish@main
        with:
          feed-url: ${{ inputs.publish-feed-url }}
          api-key: ${{ secrets.publish-api-key }}
          download-artifact: 'true'

  release:
    name: Release
    needs: [determine-version, publish]
    if: github.ref == format('refs/heads/{0}', inputs.main-branch) || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          tag-prefix: ${{ inputs.release-tag-prefix }}
          changelog-file: ${{ inputs.changelog-file }}
          cliff-config: ${{ inputs.cliff-config }}
          update-changelog: ${{ inputs.update-changelog }}
