# Reusable workflow for pushes to a release branch (callers trigger it on push to `release/**`; this file has no triggers of its own).
# One job, three steps in order:
# 1. versioning/release-pr keeps the PR release/<x.y> -> default branch open and current (never merges).
# 2. versioning/close-merged-issues closes the open issues merged into the branch (output closed). The inputs label and
#    project-status are deprecated no-ops kept for one major: a caller that sets them gets a warning, not a failure.
# 3. project/needs syncs the project field Needs of the issues closed in this run, with parents and dependents
#    (input project-url; empty = off; skipped on a dry run, which prints what it would sync).
# A caller may add workflow_dispatch (input dry-run) to run it once without a new push; a reverted PR: reopen its issues by hand.
# Tokens: the release PR is created with an installation token of the GitHub App GravionLabs CI (secrets CI_APP_ID and
# CI_APP_PRIVATE_KEY, minted with actions/create-github-app-token): a PR created with the GITHUB_TOKEN triggers no pull_request
# workflows, so required checks would never run, and the app has its own rate limit. GH_PAT (classic PAT, scope repo) is the
# deprecated fallback. Neither: the GITHUB_TOKEN with a warning, or a failure when require-pat is true.
# PROJECT_TOKEN is a classic PAT with the scope project (plus repo for a private repository) for the project Status and Needs
# calls (a GitHub App cannot access a user-owned project; the calls use the REST projectsV2 endpoints); it falls back to GH_PAT.
# Secret names match issues.yml, so `secrets: inherit` works.
# The actions are referenced at @v1, the moving major tag the release job of ci.yml moves to every release.
# The Needs sync covers only the issues closed in this run (decision): a failed sync is not retried by a rerun,
# because those issues are then already closed; the central nightly sync (project-needs.yml, mode project) catches up.
# Never checks out caller code; event data reaches scripts through env only.
name: Release branch

on:
  workflow_call:
    inputs:
      release-branch:
        description: 'Release branch, e.g. release/next; empty = the triggering ref'
        type: string
        required: false
        default: ''
      base:
        description: 'Base branch of the release PR; empty = the repository default branch'
        type: string
        required: false
        default: ''
      label:
        description: 'Deprecated no-op, kept for one major: a value only prints a warning'
        type: string
        required: false
        default: ''
      project-status:
        description: 'Deprecated no-op, kept for one major: a value only prints a warning'
        type: string
        required: false
        default: ''
      project-url:
        description: 'Project URL for the Needs sync of the closed issues; empty disables the sync'
        type: string
        required: false
        default: ''
      require-pat:
        description: 'Fail instead of warning when neither the CI app secrets nor GH_PAT are set'
        type: boolean
        required: false
        default: false
      dry-run:
        description: 'Print what would change without changing anything'
        type: boolean
        required: false
        default: false
    secrets:
      CI_APP_ID:
        description: 'ID of the GitHub App GravionLabs CI; with CI_APP_PRIVATE_KEY the release PR is created with an installation token, so its required checks run'
        required: false
      CI_APP_PRIVATE_KEY:
        description: 'Private key (PEM) of the GitHub App GravionLabs CI'
        required: false
      GH_PAT:
        description: 'Deprecated, use CI_APP_ID/CI_APP_PRIVATE_KEY: classic PAT with the scope repo for the release PR, used when no app is configured'
        required: false
      PROJECT_TOKEN:
        description: 'Classic PAT with the scope project (plus repo for a private repository) for project Status and Needs; falls back to GH_PAT'
        required: false

permissions: {}

jobs:
  release-branch:
    name: Release branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # pushes to one release branch run one after the other (PR creation and closing must not race); a running close is never cancelled
    concurrency:
      group: release-branch-${{ github.repository }}-${{ inputs.release-branch || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Check CI app
        id: app
        shell: bash
        env:
          HAS_APP: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
        run: echo "present=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Create CI app token
        id: app-token
        if: steps.app.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Check release PR token
        shell: bash
        env:
          HAS_APP: ${{ steps.app.outputs.present }}
          HAS_PAT: ${{ secrets.GH_PAT != '' }}
          REQUIRE_PAT: ${{ inputs.require-pat }}
        run: |
          if [ "$HAS_APP" = "true" ] || [ "$HAS_PAT" = "true" ]; then
            exit 0
          fi
          if [ "$REQUIRE_PAT" = "true" ]; then
            echo "::error::Neither the secrets CI_APP_ID/CI_APP_PRIVATE_KEY nor GH_PAT are set (pass secrets: inherit or the secrets) and require-pat is true."
            exit 1
          fi
          echo "::warning::No GitHub App (CI_APP_ID/CI_APP_PRIVATE_KEY) and no GH_PAT; a release PR created with the GITHUB_TOKEN triggers no pull_request workflows, so its required checks never run."

      - name: Release PR
        uses: GravionLabs/ci/versioning/release-pr@v1
        with:
          release-branch: ${{ inputs.release-branch }}
          base: ${{ inputs.base }}
          token: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
          dry-run: ${{ inputs.dry-run }}

      - name: Warn about deprecated inputs
        if: inputs.label != '' || inputs.project-status != ''
        shell: bash
        run: echo "::warning::The inputs label and project-status of release-branch.yml are deprecated no-ops (issues are closed, not labelled); remove them."

      - name: Close merged issues
        id: close
        uses: GravionLabs/ci/versioning/close-merged-issues@v1
        with:
          release-branch: ${{ inputs.release-branch }}
          base: ${{ inputs.base }}
          token: ${{ github.token }}
          dry-run: ${{ inputs.dry-run }}

      - name: Needs sync (dry run)
        if: inputs.dry-run && inputs.project-url != ''
        shell: bash
        env:
          CLOSED: ${{ steps.close.outputs.closed }}
        # a dry run closes nothing, so the output is empty: say what a real run does
        run: echo "would sync Needs of the issues closed in a real run${CLOSED:+ ($CLOSED)}, with parents and dependents"

      - name: Sync Needs of the closed issues
        if: '!inputs.dry-run && inputs.project-url != '''' && steps.close.outputs.closed != '''''
        uses: GravionLabs/ci/project/needs@v1
        with:
          project-url: ${{ inputs.project-url }}
          token: ${{ secrets.PROJECT_TOKEN || secrets.GH_PAT }}
          issues: ${{ steps.close.outputs.closed }}
