name: Renovate
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      # Renovate runs as the GitHub App GravionLabs CI, not as the user PAT: the app has its own rate limit, the pull requests
      # are authored by the bot (the maintainer can approve them) and, unlike with the GITHUB_TOKEN, they trigger the PR checks.
      # The app needs Contents, Pull requests and Workflows write (Renovate updates workflow files).
      - name: Create CI app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v41
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
