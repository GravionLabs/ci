name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/next]
  workflow_dispatch:

jobs:
  test-determine-version:
    name: 'Test: determine-version'
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # required by GitVersion

      - name: Run determine-version
        id: version
        uses: ./versioning/determine-version
        with:
          gitversion-config-file: GitVersion.yml

      - name: Validate outputs
        shell: bash
        run: |
          ERRORS=0
          check() {
            if [ -z "$2" ]; then
              echo "ERROR: output '$1' is empty"
              ERRORS=$((ERRORS + 1))
            else
              echo "$1: $2"
            fi
          }
          check semver             "${{ steps.version.outputs.semver }}"
          check major-minor-patch  "${{ steps.version.outputs.major-minor-patch }}"
          check major              "${{ steps.version.outputs.major }}"
          check minor              "${{ steps.version.outputs.minor }}"
          check patch              "${{ steps.version.outputs.patch }}"
          check python-version     "${{ steps.version.outputs.python-version }}"
          check nuget-version      "${{ steps.version.outputs.nuget-version }}"
          check docker-version     "${{ steps.version.outputs.docker-version }}"
          [ $ERRORS -eq 0 ] || exit 1

      - name: Test GitVersion release/next increment
        shell: bash
        run: bash tests/determine-version.test.sh

  test-versioning-scripts:
    name: 'Test: mark-merged-issues / close-release-issues'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (fake gh)
        shell: bash
        run: bash tests/versioning.test.sh

      - name: Smoke test mark-merged-issues (dry run, no-op path)
        uses: ./versioning/mark-merged-issues
        with:
          # a branch compared with itself is 0 commits ahead -> "nothing to do"; between releases
          # (release/next deleted) the compare fails, mark.sh warns and exits 0
          release-branch: release/next
          base: release/next
          dry-run: 'true'

      - name: Smoke test mark-merged-issues (dry run against a public release branch)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # read-only; warns and exits 0 when the branch does not exist (between releases)
        run: GITHUB_REPOSITORY=GravionLabs/apm-hub RELEASE_BRANCH=release/next DRY_RUN=true bash versioning/mark-merged-issues/mark.sh

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test-determine-version
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # required by GitVersion

      - name: Create version tag
        uses: ./versioning/create-version-tag
        with:
          version: ${{ needs.test-determine-version.outputs.semver }}

      - name: Create GitHub Release
        uses: ./versioning/gh-release
        with:
          version: ${{ needs.test-determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'
