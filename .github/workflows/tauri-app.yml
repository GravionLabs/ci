name: Tauri app CI/CD

# Reusable workflow for a Rust CLI and/or Tauri 2 application:
#   determine-version → ci ‖ draft → build (CLI binaries) ‖ installers → publish → update-changelog
# `determine-version` runs first and every later job reads the version from its outputs. Only a push to the
# default branch publishes; every other run builds with the throw-away version 0.0.<run number>.
# Call with `uses: GravionLabs/ci/.github/workflows/tauri-app.yml@v1`.

on:
  workflow_call:
    inputs:
      gitversion-config-file:
        description: 'Path to GitVersion.yml'
        type: string
        default: 'GitVersion.yml'
      conventional-commits:
        description: 'Bump the version from Conventional Commits (false = plain GitVersion defaults)'
        type: boolean
        default: true
      ci-exclude:
        description: 'Space-separated crates left out of clippy and test (the Tauri crate needs system libraries)'
        type: string
        default: ''
      cli-package:
        description: 'Crate of the CLI; several crates separated by spaces go into one archive. Empty: no CLI binaries.'
        type: string
        default: ''
      cli-binary:
        description: 'Name of the CLI binary (without .exe); with several crates all binaries separated by spaces, the first names the archive'
        type: string
        default: ''
      cli-matrix:
        description: 'JSON list of {os, target} for the CLI binaries'
        type: string
        default: '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
      tauri:
        description: 'Build the Tauri installers'
        type: boolean
        default: false
      installer-matrix:
        description: 'JSON list of {os, target} for the installers'
        type: string
        default: '[{"os":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu"},{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"}]'
      installer-args:
        description: 'Extra arguments for tauri build'
        type: string
        default: ''
      installer-linux-packages:
        description: 'Space-separated extra apt packages for the Linux installer job, besides the Tauri libraries'
        type: string
        default: ''
      apt-cache-version:
        description: 'Cache version of the Linux apt packages (Linux installer job only; the checks install no apt packages). Change it to discard the cache.'
        type: string
        default: 'v1'
      installer-sidecars:
        description: 'JSON object {"package","binary","dir"} of binaries to build into the installers (bundle.externalBin); see tauri/installers. Empty: none.'
        type: string
        default: ''
      cliff-config:
        description: 'git-cliff configuration for the release notes and the changelog'
        type: string
        default: 'cliff.toml'
      recreate-branch:
        description: 'Branch to recreate from the released commit when it does not exist on origin after the release, e.g. release/next (set it when the repository deletes merged branches); empty = off. An existing branch is never moved'
        type: string
        default: ''
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      CI_APP_ID:
        description: 'ID of the GitHub App GravionLabs CI; with CI_APP_PRIVATE_KEY the workflow mints an installation token (own rate limit, not the user PAT)'
        required: false
      CI_APP_PRIVATE_KEY:
        description: 'Private key (PEM) of the GitHub App GravionLabs CI'
        required: false
      GH_PAT:
        description: 'Deprecated, use CI_APP_ID/CI_APP_PRIVATE_KEY (fallback when no app is configured). PAT of an admin of the repository: the changelog commit goes straight to the default branch, which a ruleset only lets admins update without a pull request'
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  determine-version:
    name: determine version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      # The version to build with: the real one on a release, a numeric throw-away one otherwise.
      build-version: ${{ steps.build.outputs.version }}
      release: ${{ steps.build.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: ${{ inputs.gitversion-config-file }}
          conventional-commits: ${{ inputs.conventional-commits }}
      - name: Choose the build version
        id: build
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${{ steps.version.outputs.semver }}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: GravionLabs/ci/rust/ci@v1
        with:
          exclude: ${{ inputs.ci-exclude }}
          apt-cache-version: ${{ inputs.apt-cache-version }}

  draft:
    name: draft release
    needs: [determine-version, ci]
    if: ${{ inputs.tauri && needs.determine-version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
    steps:
      - id: draft
        uses: GravionLabs/ci/tauri/draft-release@v1
        with:
          version: ${{ needs.determine-version.outputs.build-version }}

  build:
    name: build ${{ matrix.target }}
    needs: [determine-version, ci]
    if: ${{ inputs.cli-package != '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cli-matrix) }}
    steps:
      - uses: GravionLabs/ci/rust/release-binary@v1
        with:
          version: ${{ needs.determine-version.outputs.build-version }}
          package: ${{ inputs.cli-package }}
          binary: ${{ inputs.cli-binary }}
          target: ${{ matrix.target }}

  installers:
    name: installers ${{ matrix.target }}
    needs: [determine-version, ci, draft]
    # `draft` is skipped on builds that are not releases; those only build.
    if: ${{ always() && inputs.tauri && needs.ci.result == 'success' && needs.draft.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.installer-matrix) }}
    steps:
      - uses: GravionLabs/ci/tauri/installers@v1
        with:
          version: ${{ needs.determine-version.outputs.build-version }}
          target: ${{ matrix.target }}
          release-id: ${{ needs.draft.outputs.release-id }}
          args: ${{ inputs.installer-args }}
          linux-packages: ${{ inputs.installer-linux-packages }}
          apt-cache-version: ${{ inputs.apt-cache-version }}
          sidecar-package: ${{ inputs.installer-sidecars != '' && fromJSON(inputs.installer-sidecars).package || '' }}
          sidecar-binary: ${{ inputs.installer-sidecars != '' && fromJSON(inputs.installer-sidecars).binary || '' }}
          sidecar-dir: ${{ inputs.installer-sidecars != '' && fromJSON(inputs.installer-sidecars).dir || 'src-tauri/binaries' }}
          signing-private-key: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          signing-private-key-password: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  publish:
    name: publish release
    needs: [determine-version, build, installers]
    if: ${{ always() && needs.determine-version.outputs.release == 'true' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
      # Build provenance attestation of SHA256SUMS (public repositories only; the caller must grant both).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No persisted github.token header: it would shadow the push token of the recreate step.
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: ${{ inputs.cli-package != '' }}
        with:
          path: dist
          merge-multiple: true
      - name: Combine checksums
        if: ${{ inputs.cli-package != '' }}
        run: cd dist && cat *.sha256 > SHA256SUMS && rm *.sha256
      - name: Generate the release notes
        uses: orhun/git-cliff-action@v4
        with:
          config: ${{ inputs.cliff-config }}
          args: --unreleased --tag v${{ needs.determine-version.outputs.semver }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      # A squash-merged release leaves no conventional commits for git-cliff; the notes are then the
      # change lines of the squash commit message.
      - name: Fall back to the squash commit message
        run: |
          if ! grep -q '^### ' RELEASE_NOTES.md; then
            {
              echo "## Changes"
              echo
              git log -1 --format=%b | grep -E '^\* (feat|fix|docs|perf|refactor)' | awk '!seen[$0]++'
            } > RELEASE_NOTES.md
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.determine-version.outputs.semver }}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            [ -d dist ] && gh release upload "$tag" dist/* --clobber --repo "${{ github.repository }}"
          else
            if [ -d dist ]; then files="dist/*"; else files=""; fi
            gh release create "$tag" $files --draft --target "${{ github.sha }}" \
              --title "$tag" --repo "${{ github.repository }}"
          fi
          # A version with a pre-release label (0.1.0-beta.28) is a pre-release, not the "latest" release.
          if [[ "$tag" == *-* ]]; then prerelease="--prerelease"; else prerelease="--prerelease=false"; fi
          gh release edit "$tag" --notes-file RELEASE_NOTES.md --draft=false "$prerelease" \
            --title "$tag" --repo "${{ github.repository }}"
      # tauri-action writes the asset URLs of latest.json as releases/latest/download/<file>. "latest" moves
      # to the next release, so an update that was offered could no longer be downloaded (404) once a newer
      # release existed. The URLs are pinned to the tag of their own release; the endpoint the application
      # checks (releases/latest/download/latest.json) stays the same. The signatures cover the packages, not
      # the URLs.
      - name: Pin the updater URLs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.determine-version.outputs.semver }}"
          repo="${{ github.repository }}"
          if ! gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name' | grep -qx 'latest.json'; then
            echo "$tag has no latest.json; nothing to pin"
            exit 0
          fi
          mkdir updater && gh release download "$tag" --pattern latest.json --dir updater --repo "$repo"
          sed -i "s#https://github.com/$repo/releases/latest/download/#https://github.com/$repo/releases/download/$tag/#g" updater/latest.json
          if grep -q '/releases/latest/download/' updater/latest.json; then
            echo "::error::latest.json of $tag still has releases/latest URLs"
            exit 1
          fi
          gh release upload "$tag" updater/latest.json --clobber --repo "$repo"
      # SHA256SUMS over every binary asset of the release (CLI archives and installers), written after all
      # uploads. Signatures, latest.json and the previous SHA256SUMS (CLI archives only) are not hashed.
      - name: Checksum the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.determine-version.outputs.semver }}"
          repo="${{ github.repository }}"
          # Outside the checkout: a caller repository may have its own assets/ directory, and its files must
          # never end up in SHA256SUMS or the attestation.
          work=$(mktemp -d "$RUNNER_TEMP/release.XXXXXX")
          mkdir "$work/assets"
          gh release download "$tag" --dir "$work/assets" --repo "$repo" --pattern '*'
          cd "$work/assets"
          rm -f -- *.sig latest.json SHA256SUMS
          ls -1 | LC_ALL=C sort | xargs -d '\n' sha256sum > "$work/SHA256SUMS"
          sha256sum -c "$work/SHA256SUMS"
          gh release upload "$tag" "$work/SHA256SUMS" --clobber --repo "$repo"
          echo "SHA256SUMS_PATH=$work/SHA256SUMS" >> "$GITHUB_ENV"
      # Attestations need a public repository (or a plan that supports them for private ones); private callers
      # keep SHA256SUMS and skip the attestation.
      - name: Attest the build provenance
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ env.SHA256SUMS_PATH }}
      # After a merged release/<x.y> PR: safety net that closes the delivered issues still open ("Shipped in v...").
      - uses: GravionLabs/ci/versioning/close-release-issues@v1
        continue-on-error: true
        with:
          version: ${{ needs.determine-version.outputs.semver }}
      # Recreates the release branch (normally release/next) when the repository deleted it on merge. The push uses the
      # CI app token or GH_PAT when set (a token's push starts release-branch.yml; github.token's does not).
      - name: Check CI app
        id: app
        if: ${{ inputs.recreate-branch != '' }}
        shell: bash
        env:
          HAS_APP: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
        run: echo "present=$HAS_APP" >> "$GITHUB_OUTPUT"
      - name: Create CI app token
        id: app-token
        if: ${{ inputs.recreate-branch != '' && steps.app.outputs.present == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
      - name: Fetch recreate-branch.sh
        if: ${{ inputs.recreate-branch != '' }}
        uses: actions/checkout@v4
        with:
          repository: GravionLabs/ci
          ref: v1
          path: .gravionlabs-ci
          sparse-checkout: versioning/gh-release
      - name: Recreate the release branch
        if: ${{ inputs.recreate-branch != '' }}
        shell: bash
        env:
          BRANCH: ${{ inputs.recreate-branch }}
          SHA: ${{ github.sha }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
          REPO: ${{ github.repository }}
        run: |
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git"
          bash .gravionlabs-ci/versioning/gh-release/recreate-branch.sh

  update-changelog:
    name: update changelog
    # After the release is published, so the new tag is part of the history. The commit is pushed with the CI app token (or GH_PAT)
    # when one is set (a token's push does start runs), so its message carries [skip ci].
    needs: [determine-version, publish]
    if: ${{ needs.determine-version.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check CI app
        id: app
        shell: bash
        env:
          HAS_APP: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
        run: echo "present=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Create CI app token
        id: app-token
        if: steps.app.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          # The default branch requires a pull request; only an admin's token may push the changelog commit.
          token: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
      - name: Generate the changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: ${{ inputs.cliff-config }}
        env:
          OUTPUT: CHANGELOG.generated.md
      - name: Commit the changelog
        run: |
          # An empty result must never replace the existing changelog.
          if ! grep -q '^### ' CHANGELOG.generated.md; then
            echo "git-cliff found no conventional commits; the changelog stays as it is."
            exit 0
          fi
          mv CHANGELOG.generated.md CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            echo "The changelog is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update the changelog for v${{ needs.determine-version.outputs.semver }} [skip ci]"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
