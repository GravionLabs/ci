name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-hello-world:
    name: 'Test: hello-world'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run hello-world (default)
        id: hello-default
        uses: ./hello-world

      - name: Run hello-world (custom input)
        id: hello-custom
        uses: ./hello-world
        with:
          who-to-greet: 'GitHub Actions'

      - name: Assert outputs exist
        shell: bash
        run: |
          if [ -z "${{ steps.hello-default.outputs.random-number }}" ]; then
            echo "ERROR: random-number output is empty" && exit 1
          fi
          echo "random-number (default): ${{ steps.hello-default.outputs.random-number }}"
          echo "random-number (custom):  ${{ steps.hello-custom.outputs.random-number }}"

  test-setup-node:
    name: 'Test: setup-node (Node ${{ matrix.node-version }})'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Run setup-node
        uses: ./setup-node
        with:
          node-version: ${{ matrix.node-version }}

      - name: Assert correct Node.js version
        shell: bash
        run: |
          ACTUAL=$(node --version)
          EXPECTED="v${{ matrix.node-version }}"
          if [[ "$ACTUAL" != ${EXPECTED}* ]]; then
            echo "ERROR: expected Node $EXPECTED, got $ACTUAL" && exit 1
          fi
          echo "Node version OK: $ACTUAL"

  test-determine-version:
    name: 'Test: determine-version'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # required by GitVersion

      - name: Run determine-version
        id: version
        uses: ./determine-version

      - name: Assert outputs are non-empty
        shell: bash
        run: |
          ERRORS=0
          check() {
            if [ -z "$2" ]; then
              echo "ERROR: output '$1' is empty"
              ERRORS=$((ERRORS + 1))
            else
              echo "$1: $2"
            fi
          }
          check semver             "${{ steps.version.outputs.semver }}"
          check major-minor-patch  "${{ steps.version.outputs.major-minor-patch }}"
          check major              "${{ steps.version.outputs.major }}"
          check minor              "${{ steps.version.outputs.minor }}"
          check patch              "${{ steps.version.outputs.patch }}"
          check full-semver        "${{ steps.version.outputs.full-semver }}"
          check python-version     "${{ steps.version.outputs.python-version }}"
          check nuget-version      "${{ steps.version.outputs.nuget-version }}"
          [ $ERRORS -eq 0 ] || exit 1

  test-create-version-tag:
    name: 'Test: create-version-tag'
    runs-on: ubuntu-latest
    # Only run on the default branch to avoid duplicate tags from PRs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # required by determine-version (GitVersion)

      - name: Run determine-version
        id: version
        uses: ./determine-version

      - name: Run create-version-tag
        uses: ./create-version-tag
        with:
          version: ${{ steps.version.outputs.semver }}
