name: Node.js Package CI/CD

on:
  workflow_dispatch:
    inputs:
      force-publish:
        description: 'Publish regardless of the current branch'
        type: boolean
        default: false
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use (e.g. 20, 22, 24)'
        type: string
        required: false
        default: '24'
      package-manager:
        description: 'Package manager to use (npm, pnpm, yarn)'
        type: string
        required: false
        default: 'npm'
      package-manager-version:
        description: 'Version of the package manager to install (e.g. pnpm 11.6.0). Leave empty to auto-detect from the packageManager field in package.json.'
        type: string
        required: false
        default: ''
      working-directory:
        description: 'Working directory containing the Node.js project'
        type: string
        required: false
        default: '.'
      build-command:
        description: 'Override the build command. If empty, auto-detected from package-manager.'
        type: string
        required: false
        default: ''
      run-tests:
        description: 'Whether to run the test suite after build'
        type: boolean
        required: false
        default: true
      test-command:
        description: 'Override the test command. If empty, auto-detected from package-manager.'
        type: string
        required: false
        default: ''
      coverage-format:
        description: 'Coverage report format (cobertura, lcov)'
        type: string
        required: false
        default: 'cobertura'
      gitversion-config-file:
        description: 'Path to a GitVersion.yml configuration file (optional)'
        type: string
        required: false
        default: ''
      set-version-command:
        description: 'Shell script to set package versions before publish. Receives VERSION env var from determine-version.'
        type: string
        required: false
        default: ''
      publish-command:
        description: 'Override the publish command. If empty, auto-detected from package-manager.'
        type: string
        required: false
        default: ''
      run-lint:
        description: 'Whether to run the lint step before build'
        type: boolean
        required: false
        default: true
      lint-command:
        description: 'Override the lint command. If empty, auto-detected from package-manager.'
        type: string
        required: false
        default: ''
      upload-build-artifact:
        description: 'Whether to upload the build output as an artifact for the publish job'
        type: boolean
        required: false
        default: true
      build-artifact-name:
        description: 'Name of the build artifact to upload'
        type: string
        required: false
        default: 'node-build'
      force-publish:
        description: 'Publish regardless of the current branch'
        type: boolean
        required: false
        default: false
      changelog-file:
        description: 'Path to a CHANGELOG.md file to use for release notes'
        type: string
        required: false
        default: 'CHANGELOG.md'
      cliff-config:
        description: 'Path to a cliff.toml file for git-cliff changelog generation (optional)'
        type: string
        required: false
        default: ''
      release-tag-prefix:
        description: 'Prefix for the release git tag (e.g. "v" → v1.2.3)'
        type: string
        required: false
        default: 'v'
    secrets:
      npm-token:
        description: 'NPM token or GitHub PAT for registry authentication'
        required: true

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      npm-version: ${{ steps.version.outputs.npm-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: ${{ inputs.gitversion-config-file }}

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: CI
        uses: GravionLabs/ci/node/ci@main
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          package-manager-version: ${{ inputs.package-manager-version }}
          working-directory: ${{ inputs.working-directory }}
          run-lint: ${{ inputs.run-lint }}
          lint-command: ${{ inputs.lint-command }}
          build-command: ${{ inputs.build-command }}
          run-tests: ${{ inputs.run-tests }}
          test-command: ${{ inputs.test-command }}
          coverage-format: ${{ inputs.coverage-format }}

      - name: Upload build artifact
        if: ${{ inputs.upload-build-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.build-artifact-name }}
          path: ${{ inputs.working-directory }}
          if-no-files-found: warn

  publish:
    name: Publish
    needs: [determine-version, build-test]
    if: github.ref == 'refs/heads/main' || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set package versions
        run: |
          cmd="${{ inputs.set-version-command }}"
          if [ -z "${cmd}" ]; then
            case "${{ inputs.package-manager }}" in
              pnpm) cmd="pnpm version \${VERSION} --no-git-tag-version" ;;
              yarn) cmd="yarn version \${VERSION} --no-git-tag-version" ;;
              *) cmd="npm version \${VERSION} --no-git-tag-version" ;;
            esac
          fi
          eval "${cmd}"
        env:
          VERSION: ${{ needs.determine-version.outputs.npm-version }}
        working-directory: ${{ inputs.working-directory }}

      - name: Publish packages
        uses: GravionLabs/ci/node/publish@main
        with:
          package-manager: ${{ inputs.package-manager }}
          npm-token: ${{ secrets.npm-token }}
          working-directory: ${{ inputs.working-directory }}
          publish-command: ${{ inputs.publish-command }}
          download-artifact: ${{ inputs.upload-build-artifact }}
          artifact-name: ${{ inputs.build-artifact-name }}

  release:
    name: Release
    needs: [determine-version, publish]
    if: github.ref == 'refs/heads/main' || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          tag-prefix: ${{ inputs.release-tag-prefix }}
          changelog-file: ${{ inputs.changelog-file }}
          cliff-config: ${{ inputs.cliff-config }}
