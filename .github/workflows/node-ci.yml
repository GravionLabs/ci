name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use for the build'
        required: false
        type: string
        default: '20'
      working-directory:
        description: 'Working directory containing the Node.js project'
        required: false
        type: string
        default: '.'
      run-tests:
        description: 'Whether to run the test suite'
        required: false
        type: boolean
        default: true
      test-command:
        description: 'Command to run the tests'
        required: false
        type: string
        default: 'npm run test:ci'
      coverage-format:
        description: 'Coverage report format for the summary (cobertura, lcov)'
        required: false
        type: string
        default: 'cobertura'
      upload-results:
        description: 'Whether to upload test results and coverage report as artifacts'
        required: false
        type: boolean
        default: true
      publish-results:
        description: 'Whether to publish test results as a GitHub Check Run and coverage as a job summary'
        required: false
        type: boolean
        default: true

jobs:
  build:
    name: Build & Test (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: GravionLabs/ci/node/setup@main
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        if: ${{ inputs.run-tests }}
        uses: GravionLabs/ci/node/test@main
        with:
          node-version: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}
          test-command: ${{ inputs.test-command }}
          coverage-format: ${{ inputs.coverage-format }}
          upload-results: ${{ inputs.upload-results }}
          publish-results: ${{ inputs.publish-results }}
