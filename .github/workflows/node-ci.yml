name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version to use for the build'
        required: false
        type: string
        default: '24'
      package-manager:
        description: 'Package manager to use (npm, pnpm, yarn)'
        required: false
        type: string
        default: 'npm'
      pnpm-version:
        description: 'Version of pnpm to install. Leave empty to auto-detect from the packageManager field in package.json.'
        required: false
        type: string
        default: ''
      working-directory:
        description: 'Working directory containing the Node.js project'
        required: false
        type: string
        default: '.'
      run-lint:
        description: 'Whether to run the lint step before build'
        required: false
        type: boolean
        default: true
      lint-command:
        description: 'Override the lint command. If empty, auto-detected from package-manager.'
        required: false
        type: string
        default: ''
      build-command:
        description: 'Override the build command. If empty, auto-detected from package-manager.'
        required: false
        type: string
        default: ''
      run-tests:
        description: 'Whether to run the test suite'
        required: false
        type: boolean
        default: true
      test-command:
        description: 'Override the test command. If empty, auto-detected from package-manager.'
        required: false
        type: string
        default: ''
      coverage-format:
        description: 'Coverage report format for the summary (cobertura, lcov)'
        required: false
        type: string
        default: 'cobertura'
      upload-results:
        description: 'Whether to upload test results and coverage report as artifacts'
        required: false
        type: boolean
        default: true
      publish-results:
        description: 'Whether to publish test results as a GitHub Check Run and coverage as a job summary'
        required: false
        type: boolean
        default: true

jobs:
  ci:
    name: CI (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: CI
        uses: GravionLabs/ci/node/ci@main
        with:
          node-version: ${{ inputs.node-version }}
          package-manager: ${{ inputs.package-manager }}
          pnpm-version: ${{ inputs.pnpm-version }}
          working-directory: ${{ inputs.working-directory }}
          run-lint: ${{ inputs.run-lint }}
          lint-command: ${{ inputs.lint-command }}
          build-command: ${{ inputs.build-command }}
          run-tests: ${{ inputs.run-tests }}
          test-command: ${{ inputs.test-command }}
          coverage-format: ${{ inputs.coverage-format }}
          upload-results: ${{ inputs.upload-results }}
          publish-results: ${{ inputs.publish-results }}
