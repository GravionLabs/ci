name: NuGet Package CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Version of .NET SDK to use (e.g. 8.x, 9.x, 10.x)'
        type: string
        required: false
        default: '10.x'
      dotnet-project:
        description: 'Path to a .NET project (.csproj) or solution (.sln/.slnx) file'
        type: string
        required: false
        default: '**/*.{sln,slnx}'
      test-project:
        description: 'Path or glob for the .NET test projects to run (e.g. test/**/*.Test.csproj)'
        type: string
        required: false
        default: 'test/**/*.Tests.csproj'
      configuration:
        description: 'Build configuration (e.g. Debug or Release)'
        type: string
        required: false
        default: 'Release'
      gitversion-config-file:
        description: 'Path to a GitVersion.yml configuration file (optional)'
        type: string
        required: false
        default: ''
      conventional-commits:
        description: 'Bump the version from Conventional Commits (false = plain GitVersion defaults)'
        type: boolean
        required: false
        default: true
      feed-url:
        description: 'URL of the NuGet feed for restore (optional private feed)'
        type: string
        required: false
        default: ''
      feed-name:
        description: 'Name to register the private feed as'
        type: string
        required: false
        default: 'private-feed'
      feed-username:
        description: 'Username for the private feed'
        type: string
        required: false
        default: ''
      publish-feed-url:
        description: |
          URL of the target NuGet feed to publish to:
            GitHub Packages:   https://nuget.pkg.github.com/{owner}/index.json
            Azure Artifacts:   https://pkgs.dev.azure.com/{org}/_packaging/{feed}/nuget/v3/index.json
            JFrog Artifactory: https://{domain}/artifactory/api/nuget/v3/{repo}
        type: string
        required: true
      nuget-config:
        description: 'Path to a NuGet configuration file (optional)'
        type: string
        required: false
        default: 'nuget.config'
      verbosity:
        description: 'Verbosity level (quiet, minimal, normal, detailed, diagnostic)'
        type: string
        required: false
        default: 'minimal'
      coverage-format:
        description: 'Coverage report format (cobertura, opencover, lcov, json)'
        type: string
        required: false
        default: 'cobertura'
      force-publish:
        description: 'Publish regardless of the current branch (e.g. to release pre-release/beta versions from feature branches)'
        type: boolean
        required: false
        default: false
      verify-package-files:
        description: |
          Optional newline-separated list of file paths that must exist inside the packed .nupkg.
          When provided, the package contents are verified immediately after packing.
          Example:
            lib/net8.0/MyLib.dll
            lib/net10.0/MyLib.xml
            README.md
        type: string
        required: false
        default: ''
      changelog-file:
        description: 'Path to a CHANGELOG.md file to use for release notes'
        type: string
        required: false
        default: 'CHANGELOG.md'
      cliff-config:
        description: 'Path to a cliff.toml file for git-cliff changelog generation (optional)'
        type: string
        required: false
        default: ''
      update-changelog:
        description: 'When cliff-config is set, regenerate CHANGELOG.md from git history and commit it before the release tag'
        type: boolean
        required: false
        default: false
      recreate-branch:
        description: 'Branch to recreate from the released commit when it does not exist on origin after the release, e.g. release/next (set it when the repository deletes merged branches); empty = off. An existing branch is never moved'
        type: string
        required: false
        default: ''
      release-tag-prefix:
        description: 'Prefix for the release git tag (e.g. "v" → v1.2.3)'
        type: string
        required: false
        default: 'v'
      main-branch:
        description: 'Name of the main branch; packages are only published from this branch'
        type: string
        required: false
        default: 'main'
    secrets:
      feed-token:
        description: 'Access token for the private restore feed'
        required: false
      publish-api-key:
        description: 'API key or PAT for the target publish feed'
        required: true
      CI_APP_ID:
        description: 'ID of the GitHub App GravionLabs CI; with CI_APP_PRIVATE_KEY the workflow mints an installation token (own rate limit, not the user PAT)'
        required: false
      CI_APP_PRIVATE_KEY:
        description: 'Private key (PEM) of the GitHub App GravionLabs CI'
        required: false
      GH_PAT:
        description: 'Deprecated, use CI_APP_ID/CI_APP_PRIVATE_KEY (fallback when no app is configured). PAT of an admin of the repository: gh-release pushes the changelog commit straight to the default branch, which a ruleset usually lets only admins update without a pull request'
        required: false

jobs:
  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      nuget-version: ${{ steps.version.outputs.nuget-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@v1
        with:
          gitversion-config-file: ${{ inputs.gitversion-config-file }}
          conventional-commits: ${{ inputs.conventional-commits }}

  build-test-pack:
    name: Build, Test & Pack
    runs-on: ubuntu-latest
    needs: determine-version
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Build
        uses: GravionLabs/ci/dotnet/build@v1
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          dotnet-project: ${{ inputs.dotnet-project }}
          configuration: ${{ inputs.configuration }}
          nuget-config: ${{ inputs.nuget-config }}
          verbosity: ${{ inputs.verbosity }}
          feed-url: ${{ inputs.feed-url }}
          feed-name: ${{ inputs.feed-name }}
          feed-username: ${{ inputs.feed-username }}
          feed-token: ${{ secrets.feed-token }}

      - name: Test
        uses: GravionLabs/ci/dotnet/test@v1
        with:
          test-project: ${{ inputs.test-project }}
          configuration: ${{ inputs.configuration }}
          verbosity: ${{ inputs.verbosity }}
          coverage-format: ${{ inputs.coverage-format }}
          upload-results: 'true'

      - name: Pack
        uses: GravionLabs/ci/dotnet/nuget/pack@v1
        with:
          dotnet-project: ${{ inputs.dotnet-project }}
          configuration: ${{ inputs.configuration }}
          version: ${{ needs.determine-version.outputs.nuget-version }}

      - name: Verify Package Contents
        if: inputs.verify-package-files != ''
        uses: GravionLabs/ci/dotnet/nuget/verify-package@v1
        with:
          files: ${{ inputs.verify-package-files }}

  publish:
    name: Publish
    needs: [determine-version, build-test-pack]
    if: github.ref == format('refs/heads/{0}', inputs.main-branch) || inputs.force-publish == true
    runs-on: ubuntu-latest
    environment: nuget-publish
    steps:
      - name: Publish NuGet packages
        uses: GravionLabs/ci/dotnet/nuget/publish@v1
        with:
          feed-url: ${{ inputs.publish-feed-url }}
          api-key: ${{ secrets.publish-api-key }}
          download-artifact: 'true'

  release:
    name: Release
    needs: [determine-version, publish]
    if: github.ref == format('refs/heads/{0}', inputs.main-branch) || inputs.force-publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Check CI app
        id: app
        shell: bash
        env:
          HAS_APP: ${{ secrets.CI_APP_ID != '' && secrets.CI_APP_PRIVATE_KEY != '' }}
        run: echo "present=$HAS_APP" >> "$GITHUB_OUTPUT"

      - name: Create CI app token
        id: app-token
        if: steps.app.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@v1
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          tag-prefix: ${{ inputs.release-tag-prefix }}
          changelog-file: ${{ inputs.changelog-file }}
          cliff-config: ${{ inputs.cliff-config }}
          recreate-branch: ${{ inputs.recreate-branch }}
          update-changelog: ${{ inputs.update-changelog }}
          # The default branch usually requires a pull request; only an admin's token (the GitHub App as ruleset bypass actor, or GH_PAT) may push the changelog commit.
          token: ${{ steps.app-token.outputs.token || secrets.GH_PAT || github.token }}
