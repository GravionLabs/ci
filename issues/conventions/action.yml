name: Issue conventions
description: >-
  Sets the "[Level] " title prefix from the level label and flags issues that miss required sections.
  Run it on `issues` events; the token needs `issues: write`.

inputs:
  levels:
    description: Comma-separated level labels in precedence order; the label becomes the title prefix (known ones as Epic, Feature, PBI, Task, Bug, others capitalized)
    required: false
    default: epic,feature,pbi,task,bug
  required-sections:
    description: 'JSON map of level label to required headings, e.g. {"task":["Files","Done when"]}; empty or {} disables the section check'
    required: false
    default: '{}'
  token:
    description: Token with issues write access
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        LEVELS: ${{ inputs.levels }}
        REQUIRED_SECTIONS: ${{ inputs.required-sections }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { default: run } = await import(`${process.env.ACTION_PATH}/run.mjs`);
          await run({
            github,
            context,
            core,
            inputs: { levels: process.env.LEVELS, requiredSections: process.env.REQUIRED_SECTIONS },
          });
