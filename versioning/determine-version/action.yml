name: 'Determine Version'
description: >
  Determines the semantic version of the repository from its git history using
  GitVersion. Produces version strings suitable for Docker, npm/Angular, Python
  (PEP 440), NuGet, and .NET assemblies.
  Requires the caller to check out with fetch-depth: 0.

inputs:
  gitversion-version-spec:
    description: 'GitVersion tool version to install (semver range)'
    required: false
    default: '6.x'
  gitversion-config-file:
    description: 'Path to the GitVersion.yml configuration file (optional, uses GitVersion defaults if not set)'
    required: false
    default: ''
  conventional-commits:
    description: >
      Bump the version from Conventional Commits (fix/perf/revert = patch, feat = minor,
      type! or BREAKING CHANGE = major; +semver: stays as escape hatch). 'false' keeps the plain GitVersion defaults.
    required: false
    default: 'true'

outputs:
  semver:
    description: 'Full SemVer (e.g. 1.2.3-alpha.4) — use for npm, Angular, NuGet, Docker'
    value: ${{ steps.gitversion.outputs.semVer }}
  major-minor-patch:
    description: 'Stable version without pre-release (e.g. 1.2.3)'
    value: ${{ steps.gitversion.outputs.majorMinorPatch }}
  major:
    description: 'Major version number (e.g. 1)'
    value: ${{ steps.gitversion.outputs.major }}
  minor:
    description: 'Minor version number (e.g. 2)'
    value: ${{ steps.gitversion.outputs.minor }}
  patch:
    description: 'Patch version number (e.g. 3)'
    value: ${{ steps.gitversion.outputs.patch }}
  pre-release-tag:
    description: 'Full pre-release tag (e.g. alpha.4); empty on stable releases'
    value: ${{ steps.gitversion.outputs.preReleaseTag }}
  pre-release-label:
    description: 'Pre-release label (e.g. alpha, beta, rc); empty on stable releases'
    value: ${{ steps.gitversion.outputs.preReleaseLabel }}
  pre-release-number:
    description: 'Pre-release number (e.g. 4)'
    value: ${{ steps.gitversion.outputs.preReleaseNumber }}
  informational-version:
    description: 'Long version with branch and SHA — use for .NET AssemblyInformationalVersion'
    value: ${{ steps.gitversion.outputs.informationalVersion }}
  assembly-sem-ver:
    description: 'Assembly-compatible version (e.g. 1.2.0.0) — use for .NET AssemblyVersion'
    value: ${{ steps.gitversion.outputs.assemblySemVer }}
  assembly-sem-file-ver:
    description: 'Assembly file version (e.g. 1.2.3.0) — use for .NET AssemblyFileVersion'
    value: ${{ steps.gitversion.outputs.assemblySemFileVer }}
  nuget-version:
    description: 'NuGet-compatible version (e.g. 1.2.3-alpha.4)'
    value: ${{ steps.gitversion.outputs.semVer }}
  npm-version:
    description: 'npm-compatible SemVer (e.g. 1.2.3-alpha.4)'
    value: ${{ steps.gitversion.outputs.semVer }}
  python-version:
    description: 'PEP 440-compatible version (e.g. 1.2.3a4) — use for Python / uv packages'
    value: ${{ steps.python-version.outputs.python-version }}
  docker-version:
    description: 'SemVer with short commit hash (e.g. 1.2.3-alpha.4-abc1234) — use for Docker image tags'
    value: ${{ steps.docker-version.outputs.docker-version }}

runs:
  using: 'composite'
  steps:
    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v4.5.0
      with:
        versionSpec: ${{ inputs.gitversion-version-spec }}

    - name: Conventional Commits bump rules
      id: bump-rules
      shell: bash
      env:
        CONVENTIONAL_COMMITS: ${{ inputs.conventional-commits }}
      run: |
        if [ "$CONVENTIONAL_COMMITS" = "false" ]; then
          echo "override-config=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        {
          echo 'override-config<<GV_EOF'
          echo 'major-version-bump-message=\+semver:\s?(breaking|major)|^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([\w\s-,/\\]*\))?(!:|:.*\n\n((.+\n)+\n)?BREAKING CHANGE:\s.+)'
          echo 'minor-version-bump-message=\+semver:\s?(feature|minor)|^(feat)(\([\w\s-,/\\]*\))?:'
          echo 'patch-version-bump-message=\+semver:\s?(fix|patch)|^(fix|perf|revert)(\([\w\s-,/\\]*\))?:'
          echo 'GV_EOF'
        } >> "$GITHUB_OUTPUT"

    - name: Determine version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.5.0
      with:
        overrideConfig: ${{ steps.bump-rules.outputs.override-config }}
        configFilePath: ${{ inputs.gitversion-config-file != '' && inputs.gitversion-config-file || '' }}

    - name: Convert to PEP 440 (Python version)
      id: python-version
      shell: bash
      run: |
        MMP="${{ steps.gitversion.outputs.majorMinorPatch }}"
        LABEL="${{ steps.gitversion.outputs.preReleaseLabel }}"
        NUM="${{ steps.gitversion.outputs.preReleaseNumber }}"

        if [ -z "$LABEL" ]; then
          PYTHON_VER="$MMP"
        elif [ "$LABEL" = "alpha" ]; then
          PYTHON_VER="${MMP}a${NUM}"
        elif [ "$LABEL" = "beta" ]; then
          PYTHON_VER="${MMP}b${NUM}"
        elif [ "$LABEL" = "rc" ] || [ "$LABEL" = "preview" ]; then
          PYTHON_VER="${MMP}rc${NUM}"
        else
          PYTHON_VER="${MMP}.dev${NUM:-0}"
        fi

        echo "python-version=$PYTHON_VER" >> "$GITHUB_OUTPUT"

    - name: Compute Docker version
      id: docker-version
      shell: bash
      run: |
        SEMVER="${{ steps.gitversion.outputs.semVer }}"
        SHORT_SHA="${{ steps.gitversion.outputs.shortSha }}"
        echo "docker-version=${SEMVER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

    - name: Report versions
      shell: bash
      run: |
        SEMVER="${{ steps.gitversion.outputs.semVer }}"
        MMP="${{ steps.gitversion.outputs.majorMinorPatch }}"
        PRE_TAG="${{ steps.gitversion.outputs.preReleaseTag }}"
        INFO="${{ steps.gitversion.outputs.informationalVersion }}"
        ASM="${{ steps.gitversion.outputs.assemblySemVer }}"
        ASM_FILE="${{ steps.gitversion.outputs.assemblySemFileVer }}"
        PYTHON="${{ steps.python-version.outputs.python-version }}"
        DOCKER="${{ steps.docker-version.outputs.docker-version }}"

        echo "SemVer:               $SEMVER"
        echo "MajorMinorPatch:      $MMP"
        echo "PreReleaseTag:        $PRE_TAG"
        echo "InformationalVersion: $INFO"
        echo "AssemblySemVer:       $ASM"
        echo "AssemblySemFileVer:   $ASM_FILE"
        echo "NuGet:                $SEMVER"
        echo "npm:                  $SEMVER"
        echo "Python (PEP 440):     $PYTHON"
        echo "Docker:               $DOCKER"

        {
          echo "## Version"
          echo "| Output | Value |"
          echo "| --- | --- |"
          echo "| SemVer | \`$SEMVER\` |"
          echo "| MajorMinorPatch | \`$MMP\` |"
          echo "| PreReleaseTag | \`$PRE_TAG\` |"
          echo "| InformationalVersion | \`$INFO\` |"
          echo "| AssemblySemVer | \`$ASM\` |"
          echo "| AssemblySemFileVer | \`$ASM_FILE\` |"
          echo "| NuGet | \`$SEMVER\` |"
          echo "| npm | \`$SEMVER\` |"
          echo "| Python (PEP 440) | \`$PYTHON\` |"
          echo "| Docker | \`$DOCKER\` |"
        } >> "$GITHUB_STEP_SUMMARY"
