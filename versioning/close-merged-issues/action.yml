name: 'Close Merged Issues'
description: >
  On a push to a release/* branch (incl. release/next), closes the open issues delivered to that
  branch as completed: Closes/Fixes/Resolves #n in the PRs merged into it since it left the base,
  plus Closes/Fixes/Resolves footer lines in the commit messages of base...branch ("Refs #n" never
  closes). Each closed issue gets one comment naming the branch, the PR and the milestone it ships
  with. Parents labeled pbi or feature whose sub-issues are all closed are closed too (repeating
  upwards; epics never). The label merged is removed from the closed issues. Pull requests and
  closed issues are skipped. Idempotent. Missing permissions only warn.
  Requires contents: read, issues: write and pull-requests: read.

inputs:
  release-branch:
    description: 'Release branch (release/*); defaults to the ref that triggered the workflow'
    required: false
    default: ''
  base:
    description: 'Base branch the release lands on; defaults to the repository default branch'
    required: false
    default: ''
  token:
    description: 'GitHub token used for the gh CLI'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'Print the issues that would be closed without changing anything'
    required: false
    default: 'false'

outputs:
  closed:
    description: 'Space-separated numbers of the issues closed in this run (empty when none, also on a dry run)'
    value: ${{ steps.close.outputs.closed }}

runs:
  using: 'composite'
  steps:
    - id: close
      name: Close issues merged into the release branch
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        RELEASE_BRANCH: ${{ inputs.release-branch || github.ref_name }}
        BASE: ${{ inputs.base }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${{ github.action_path }}/close.sh"
