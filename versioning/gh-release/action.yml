name: 'Create GitHub Release'
description: >
  Creates a version tag and a GitHub Release.
  Optionally uses git-cliff to auto-generate release notes from Conventional Commits.
  When cliff-config is set, git-cliff generates the notes and can also update CHANGELOG.md.
  Falls back to extracting a section from a CHANGELOG.md, then to GitHub auto-generated notes.
  Skips silently if the release already exists. Marks pre-release automatically
  when the version contains a pre-release identifier (e.g. 1.2.3-alpha.4).
  Requires contents: write permission in the calling workflow.

inputs:
  version:
    description: 'Version to release (e.g. 1.2.3 or 1.2.3-alpha.4)'
    required: true
  tag-prefix:
    description: 'Prefix for the git tag (e.g. "v" → v1.2.3)'
    required: false
    default: 'v'
  changelog-file:
    description: 'Path to a CHANGELOG.md file to extract release notes from'
    required: false
    default: 'CHANGELOG.md'
  generate-release-notes:
    description: 'Fall back to GitHub auto-generated release notes if no changelog section is found'
    required: false
    default: 'true'
  cliff-config:
    description: >
      Path to a cliff.toml configuration file for git-cliff.
      When set, git-cliff generates release notes from Conventional Commits instead of
      extracting from CHANGELOG.md. Requires git history (fetch-depth: 0).
    required: false
    default: ''
  update-changelog:
    description: >
      When cliff-config is set, regenerate CHANGELOG.md from the full git history
      and commit it (with [skip ci]) before creating the release tag.
    required: false
    default: 'false'
  token:
    description: >
      GitHub token used for checkout and git push operations.
      Override with a PAT when the default GITHUB_TOKEN cannot push to protected branches.
    required: false
    default: ${{ github.token }}

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ inputs.token }}
        fetch-depth: 0
        ref: ${{ github.ref_name }}

    - name: Generate release notes with git-cliff
      id: cliff
      if: ${{ inputs.cliff-config != '' }}
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ inputs.cliff-config }}
        args: --unreleased --tag ${{ inputs.tag-prefix }}${{ inputs.version }}

    - name: Update CHANGELOG.md with git-cliff
      if: ${{ inputs.cliff-config != '' && inputs.update-changelog == 'true' }}
      uses: orhun/git-cliff-action@v4
      with:
        config: ${{ inputs.cliff-config }}
        args: --tag ${{ inputs.tag-prefix }}${{ inputs.version }}
      env:
        OUTPUT: ${{ inputs.changelog-file }}

    - name: Commit updated CHANGELOG.md
      if: ${{ inputs.cliff-config != '' && inputs.update-changelog == 'true' }}
      shell: bash
      env:
        TAG: ${{ inputs.tag-prefix }}${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog-file }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add "$CHANGELOG"
        if git diff --cached --quiet; then
          echo "No changes to $CHANGELOG — skipping commit."
        else
          git commit -m "docs: update $CHANGELOG for $TAG [skip ci]"
          git push
        fi

    - name: Create version tag
      uses: GravionLabs/ci/versioning/create-version-tag@main
      with:
        version: ${{ inputs.version }}
        tag-prefix: ${{ inputs.tag-prefix }}

    - name: Extract changelog section
      id: changelog
      if: ${{ inputs.cliff-config == '' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        CHANGELOG: ${{ inputs.changelog-file }}
      run: |
        if [ ! -f "$CHANGELOG" ]; then
          echo "No changelog file found at $CHANGELOG — skipping extraction."
          echo "notes=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # Extract the section whose header contains the version string.
        # Supports formats: ## [1.2.3], ## [1.2.3] — Description, ## 1.2.3 ...
        notes=$(awk -v ver="$VERSION" '
          /^## / {
            if (found) { exit }
            if (index($0, ver) > 0) { found = 1; next }
          }
          found { print }
        ' "$CHANGELOG")

        if [ -z "$notes" ]; then
          echo "No changelog section found for version $VERSION."
          echo "notes=" >> "$GITHUB_OUTPUT"
        else
          {
            echo "notes<<GH_RELEASE_NOTES_EOF"
            printf '%s\n' "$notes"
            echo "GH_RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
        fi

    - name: Create GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag-prefix }}${{ inputs.version }}
        VERSION: ${{ inputs.version }}
        NOTES: ${{ steps.changelog.outputs.notes }}
        CLIFF_NOTES: ${{ steps.cliff.outputs.content }}
        GENERATE_NOTES: ${{ inputs.generate-release-notes }}
      run: |
        if gh release view "$TAG" &>/dev/null; then
          echo "Release $TAG already exists — skipping."
          exit 0
        fi

        # Mark as pre-release when version contains a pre-release identifier.
        if echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-'; then
          PRERELEASE_FLAG="--prerelease"
        else
          PRERELEASE_FLAG=""
        fi

        # Prefer git-cliff notes, then CHANGELOG.md section, then GitHub auto-generated.
        if [ -n "$CLIFF_NOTES" ]; then
          echo "$CLIFF_NOTES" > /tmp/release_notes.md
          gh release create "$TAG" --title "$TAG" --notes-file /tmp/release_notes.md $PRERELEASE_FLAG
        elif [ -n "$NOTES" ]; then
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" $PRERELEASE_FLAG
        elif [ "$GENERATE_NOTES" = "true" ]; then
          gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE_FLAG
        else
          gh release create "$TAG" --title "$TAG" --notes "" $PRERELEASE_FLAG
        fi

