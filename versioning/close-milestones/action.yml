name: 'Close Shipped Milestones'
description: >
  After the release tag v<x.y.z> exists, closes every open milestone that shipped with it and renames it to
  "M<nnn> [<Topic>] (x.y.z)" (a legacy "x.y.z" title is closed without renaming). A milestone shipped with the
  release when it has no open issue and one of the pull requests of the release (previous stable tag to this tag)
  or an issue they close (Closes/Fixes/Resolves #n) belongs to it. A milestone with open issues is never closed;
  a notice names it and the open issues. A pre-release version closes nothing. Idempotent.
  Requires contents: read and issues: write in the calling workflow.

inputs:
  version:
    description: 'Released version without prefix (e.g. 1.2.0); a pre-release version (1.2.0-rc.1) closes nothing'
    required: true
  tag-prefix:
    description: 'Prefix of the release tag'
    required: false
    default: 'v'
  token:
    description: 'GitHub token used for the gh CLI'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'Print what would change without closing or renaming anything'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Close the milestones shipped with the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        TAG_PREFIX: ${{ inputs.tag-prefix }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${{ github.action_path }}/close.sh"
