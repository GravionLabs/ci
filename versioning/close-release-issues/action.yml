name: 'Close Release Issues'
description: >
  After a release/<x.y> branch was merged into the default branch, closes every issue the
  release delivered: issues referenced with Closes/Fixes/Resolves #n in the merged PRs of the
  release branch and in the release PR, their open sub-issues, and parents labeled pbi or
  feature whose sub-issues are all closed. Epics are never closed. Does nothing when the
  triggering commit is not a merged release PR. Idempotent.
  Requires issues: write, pull-requests: read and contents: read in the calling workflow.

inputs:
  version:
    description: 'Released version without prefix (e.g. 1.2.0); used in the closing comment'
    required: false
    default: ''
  token:
    description: 'GitHub token used for the gh CLI'
    required: false
    default: ${{ github.token }}
  dry-run:
    description: 'Print what would be closed without closing anything'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Close issues delivered by the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: bash "${{ github.action_path }}/close.sh"
