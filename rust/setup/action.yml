name: 'Setup Rust'
description: 'Installs the Rust toolchain (rust-toolchain.toml or an explicit one) and caches cargo builds; optionally installs the Linux libraries Tauri needs'

inputs:
  toolchain:
    description: 'Toolchain to install (stable, 1.94.1, ...). Leave empty to use rust-toolchain.toml of the repository, or stable when there is none.'
    required: false
    default: ''
  components:
    description: 'Comma-separated components (for example rustfmt,clippy). Added to those of rust-toolchain.toml.'
    required: false
    default: 'rustfmt,clippy'
  targets:
    description: 'Comma-separated extra targets (for example aarch64-unknown-linux-gnu)'
    required: false
    default: ''
  cache:
    description: 'Cache cargo builds with Swatinem/rust-cache'
    required: false
    default: 'true'
  cache-key:
    description: 'Extra cache key, for example the matrix target when several jobs share a runner OS'
    required: false
    default: ''
  workspaces:
    description: 'Cargo workspaces for the cache (rust-cache syntax, e.g. ". -> target"). Empty uses the repository root.'
    required: false
    default: ''
  tauri-linux-deps:
    description: 'Install the system libraries Tauri 2 needs on Linux runners (webkit2gtk 4.1 and friends). Ignored on other runners.'
    required: false
    default: 'false'
  linux-packages:
    description: 'Space-separated extra apt packages to install on Linux runners (for example libgtk-layer-shell-dev), besides the Tauri libraries. Ignored on other runners.'
    required: false
    default: ''
  apt-cache-version:
    description: 'Cache version of the Linux apt packages (tauri-linux-deps, linux-packages). Change it to discard the cache and download the packages again.'
    required: false
    default: 'v1'

runs:
  using: 'composite'
  steps:
    - name: Compute the Linux package list
      id: apt
      if: ${{ (inputs.tauri-linux-deps == 'true' || inputs.linux-packages != '') && runner.os == 'Linux' }}
      shell: bash
      env:
        TAURI: ${{ inputs.tauri-linux-deps }}
        EXTRA: ${{ inputs.linux-packages }}
      run: |
        list=""
        if [ "$TAURI" = "true" ]; then
          list="libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev"
        fi
        # collapse the whitespace of the extra package names
        list="$(echo "$list $EXTRA" | xargs)"
        echo "packages=$list" >> "$GITHUB_OUTPUT"

    # The cache action keys only on the package list and `version`; the OS release is not in it, so the
    # runner image goes into `version` (ImageOS is a runner env var, not available to expressions here).
    - name: Compute the apt cache key
      id: aptkey
      if: ${{ steps.apt.outputs.packages != '' }}
      shell: bash
      env:
        APT_CACHE_VERSION: ${{ inputs.apt-cache-version }}
      run: echo "key=${RUNNER_OS}-${ImageOS:-unknown}-${APT_CACHE_VERSION}" >> "$GITHUB_OUTPUT"

    # Restores the .deb files from the Actions cache (key: runner image, package list, version) and installs
    # them from the mirror only on a cache miss.
    - name: Install Linux packages (cached)
      if: ${{ steps.apt.outputs.packages != '' }}
      # awalsh128/cache-apt-pkgs-action v1.6.3
      uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9
      with:
        packages: ${{ steps.apt.outputs.packages }}
        version: ${{ steps.aptkey.outputs.key }}

    - name: Install the toolchain from rust-toolchain.toml
      if: ${{ inputs.toolchain == '' && hashFiles('rust-toolchain.toml', 'rust-toolchain') != '' }}
      shell: bash
      run: rustup show active-toolchain || rustup toolchain install

    - name: Install the toolchain
      if: ${{ inputs.toolchain != '' || hashFiles('rust-toolchain.toml', 'rust-toolchain') == '' }}
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain != '' && inputs.toolchain || 'stable' }}
      run: |
        rustup toolchain install "$TOOLCHAIN" --profile minimal
        rustup default "$TOOLCHAIN"

    - name: Install components and targets
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        if [ -n "$COMPONENTS" ]; then rustup component add ${COMPONENTS//,/ }; fi
        if [ -n "$TARGETS" ]; then rustup target add ${TARGETS//,/ }; fi
        rustc --version
        cargo --version

    - name: Cache cargo builds
      if: ${{ inputs.cache == 'true' }}
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cache-key }}
        workspaces: ${{ inputs.workspaces }}
