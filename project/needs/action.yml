name: Project needs
description: >-
  Keeps the project field Needs current by running Sync-ProjectNeeds.ps1 of the github-project skill in this repository
  (.apm/skills/github-project/scripts, resolved from the action path of the same ref).
  Run it on issues, pull_request_target, schedule or workflow_dispatch events. The calling repository and PR code are
  never checked out, and event data reaches the script through the environment only. No token: one warning and a green step.

inputs:
  project-url:
    description: Project URL, https://github.com/users/<owner>/projects/<n> or https://github.com/orgs/<owner>/projects/<n>
    required: true
  token:
    description: Classic PAT with the scope project, plus repo for a private repository (a user-owned project is not writable with the GITHUB_TOKEN); empty skips the sync with a warning
    required: false
    default: ''
  mode:
    description: 'event: sync the issue of the event (and its parent, plus dependents on blocker events); full: sync every item of the repository'
    required: false
    default: event
  issues:
    description: 'Issue numbers (space, comma or newline separated) to sync with their parents and dependents; overrides the event (mode full still wins)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Check token
      id: token
      shell: bash
      env:
        HAS_TOKEN: ${{ inputs.token != '' }}
      run: |
        if [ "$HAS_TOKEN" = "true" ]; then
          echo "present=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::No token for project/needs (pass a classic PAT with the scope project, plus repo for a private repository); skipping the Needs sync."
          echo "present=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Sync Needs
      if: steps.token.outputs.present == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        PROJECT_URL: ${{ inputs.project-url }}
        MODE: ${{ inputs.mode }}
        ISSUES: ${{ inputs.issues }}
        EVENT_NAME: ${{ github.event_name }}
        EVENT_ACTION: ${{ github.event.action }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        LABEL_NAME: ${{ github.event.label.name }}
        SYNC_SCRIPT: ${{ github.action_path }}/../../.apm/skills/github-project/scripts/Sync-ProjectNeeds.ps1
      run: bash "$GITHUB_ACTION_PATH/needs.sh"
