name: 'Build Node.js'
description: 'Install dependencies and build a Node.js project'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 20, 22)'
    required: false
    default: '24'
  package-manager:
    description: 'Package manager to use (npm, pnpm, yarn)'
    required: false
    default: 'npm'
  working-directory:
    description: 'Working directory containing the Node.js project'
    required: false
    default: '.'
  build-command:
    description: 'Override the build command. If empty, automatically determined from the package-manager input (e.g. npm run build, pnpm run build, yarn run build)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: GravionLabs/ci/node/setup@main
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        case "${{ inputs.package-manager }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) yarn install --frozen-lockfile ;;
          *) npm ci ;;
        esac

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cmd="${{ inputs.build-command }}"
        if [ -z "${cmd}" ]; then
          case "${{ inputs.package-manager }}" in
            pnpm) cmd="pnpm run build" ;;
            yarn) cmd="yarn run build" ;;
            *) cmd="npm run build" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"
