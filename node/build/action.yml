name: 'Build Node.js'
description: 'Install dependencies and build a Node.js project'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 20, 22)'
    required: false
    default: '22'
  working-directory:
    description: 'Working directory containing the Node.js project'
    required: false
    default: '.'
  build-command:
    description: 'Command to build the project'
    required: false
    default: 'npm run build --if-present'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: GravionLabs/ci/node/setup@main
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.build-command }}
