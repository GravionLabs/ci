name: 'Test Node.js'
description: 'Run Node.js unit tests with code coverage collection and result publishing (supports npm, pnpm, yarn)'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 20, 22)'
    required: false
    default: '24'
  package-manager:
    description: 'Package manager to use (npm, pnpm, yarn)'
    required: false
    default: 'npm'
  working-directory:
    description: 'Working directory containing the Node.js project'
    required: false
    default: '.'
  test-command:
    description: 'Command to run the tests (must produce JUnit XML at test-results/junit.xml and coverage at coverage/)'
    required: false
    default: 'npm run test:ci'
  coverage-format:
    description: 'Coverage report format for the summary (cobertura, lcov)'
    required: false
    default: 'cobertura'
  upload-results:
    description: 'Whether to upload test results and coverage report as artifacts'
    required: false
    default: 'true'
  publish-results:
    description: 'Whether to publish test results as a GitHub Check Run and coverage as a job summary'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: GravionLabs/ci/node/setup@main
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        case "${{ inputs.package-manager }}" in
          pnpm) pnpm install ;;
          yarn) yarn install --frozen-lockfile ;;
          *)    npm ci ;;
        esac

    - name: Run tests
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ${{ inputs.test-command }}

    - name: Upload test results artifact
      if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ inputs.working-directory }}/test-results/junit.xml
        if-no-files-found: warn

    - name: Upload coverage artifact
      if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ inputs.working-directory }}/coverage/
        if-no-files-found: warn

    - name: Publish test results
      if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: ${{ inputs.working-directory }}/test-results/junit.xml
        reporter: jest-junit
        fail-on-error: false

    - name: Publish coverage summary
      if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ${{ inputs.working-directory }}/coverage/cobertura-coverage.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both
