name: 'CI Node.js'
description: 'Lint, build, and test a Node.js project with a single setup and dependency installation'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 24, 26)'
    required: false
    default: '26'
  package-manager:
    description: 'Package manager to use (npm, pnpm, yarn)'
    required: false
    default: 'npm'
  package-manager-version:
    description: 'Version of the package manager to install (e.g. pnpm 11.6.0). Leave empty to auto-detect from the packageManager field in package.json.'
    required: false
    default: ''
  working-directory:
    description: 'Working directory containing the Node.js project'
    required: false
    default: '.'
  run-lint:
    description: 'Whether to run the lint step'
    required: false
    default: 'true'
  lint-command:
    description: 'Override the lint command. If empty, auto-detected from package-manager.'
    required: false
    default: ''
  build-command:
    description: 'Override the build command. If empty, auto-detected from package-manager.'
    required: false
    default: ''
  run-tests:
    description: 'Whether to run the test suite'
    required: false
    default: 'true'
  test-command:
    description: 'Override the test command. If empty, auto-detected from package-manager.'
    required: false
    default: ''
  coverage-format:
    description: 'Coverage report format for the summary (cobertura, lcov)'
    required: false
    default: 'cobertura'
  upload-results:
    description: 'Whether to upload test results and coverage report as artifacts'
    required: false
    default: 'true'
  publish-results:
    description: 'Whether to publish test results as a GitHub Check Run and coverage as a job summary'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Node.js
      uses: GravionLabs/ci/node/setup@v1
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}
        package-manager-version: ${{ inputs.package-manager-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        case "${PACKAGE_MANAGER}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) yarn install --frozen-lockfile ;;
          *) npm ci ;;
        esac

    - name: Lint
      if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || inputs.run-lint == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        LINT_COMMAND: ${{ inputs.lint-command }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        cmd="${LINT_COMMAND}"
        if [ -z "${cmd}" ]; then
          case "${PACKAGE_MANAGER}" in
            pnpm) cmd="pnpm run lint" ;;
            yarn) cmd="yarn run lint" ;;
            *) cmd="npm run lint" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUILD_COMMAND: ${{ inputs.build-command }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        cmd="${BUILD_COMMAND}"
        if [ -z "${cmd}" ]; then
          case "${PACKAGE_MANAGER}" in
            pnpm) cmd="pnpm run build" ;;
            yarn) cmd="yarn run build" ;;
            *) cmd="npm run build" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"

    - name: Run tests
      if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' || inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_COMMAND: ${{ inputs.test-command }}
        PACKAGE_MANAGER: ${{ inputs.package-manager }}
      run: |
        cmd="${TEST_COMMAND}"
        if [ -z "${cmd}" ]; then
          case "${PACKAGE_MANAGER}" in
            pnpm) cmd="pnpm run test:ci" ;;
            yarn) cmd="yarn run test:ci" ;;
            *) cmd="npm run test:ci" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"

    - name: Upload test results artifact
      if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results
        path: ${{ inputs.working-directory }}/test-results/junit.xml
        if-no-files-found: warn

    - name: Upload coverage artifact
      if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: coverage
        path: ${{ inputs.working-directory }}/coverage/
        if-no-files-found: warn

    - name: Publish test results
      if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: dorny/test-reporter@31a54ee7ebcacc03a09ea97a7e5465a47b84aea5 # v1.9.1
      with:
        name: Test Results
        path: ${{ inputs.working-directory }}/test-results/junit.xml
        reporter: jest-junit
        fail-on-error: false

    - name: Publish coverage summary
      if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: ${{ inputs.working-directory }}/coverage/cobertura-coverage.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both
