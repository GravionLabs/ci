name: 'CI Node.js'
description: 'Lint, build, and test a Node.js project with a single setup and dependency installation'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 20, 22)'
    required: false
    default: '24'
  package-manager:
    description: 'Package manager to use (npm, pnpm, yarn)'
    required: false
    default: 'npm'
  pnpm-version:
    description: 'Version of pnpm to install (only used when package-manager is pnpm). Leave empty to auto-detect from the packageManager field in package.json.'
    required: false
    default: ''
  working-directory:
    description: 'Working directory containing the Node.js project'
    required: false
    default: '.'
  run-lint:
    description: 'Whether to run the lint step'
    required: false
    default: 'true'
  lint-command:
    description: 'Override the lint command. If empty, auto-detected from package-manager.'
    required: false
    default: ''
  build-command:
    description: 'Override the build command. If empty, auto-detected from package-manager.'
    required: false
    default: ''
  run-tests:
    description: 'Whether to run the test suite'
    required: false
    default: 'true'
  test-command:
    description: 'Override the test command. If empty, auto-detected from package-manager.'
    required: false
    default: ''
  coverage-format:
    description: 'Coverage report format for the summary (cobertura, lcov)'
    required: false
    default: 'cobertura'
  upload-results:
    description: 'Whether to upload test results and coverage report as artifacts'
    required: false
    default: 'true'
  publish-results:
    description: 'Whether to publish test results as a GitHub Check Run and coverage as a job summary'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: GravionLabs/ci/node/setup@main
      with:
        node-version: ${{ inputs.node-version }}
        package-manager: ${{ inputs.package-manager }}
        pnpm-version: ${{ inputs.pnpm-version }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        case "${{ inputs.package-manager }}" in
          pnpm) pnpm install --frozen-lockfile ;;
          yarn) yarn install --frozen-lockfile ;;
          *) npm ci ;;
        esac

    - name: Lint
      if: ${{ inputs.run-lint == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cmd="${{ inputs.lint-command }}"
        if [ -z "${cmd}" ]; then
          case "${{ inputs.package-manager }}" in
            pnpm) cmd="pnpm run lint" ;;
            yarn) cmd="yarn run lint" ;;
            *) cmd="npm run lint" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"

    - name: Build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cmd="${{ inputs.build-command }}"
        if [ -z "${cmd}" ]; then
          case "${{ inputs.package-manager }}" in
            pnpm) cmd="pnpm run build" ;;
            yarn) cmd="yarn run build" ;;
            *) cmd="npm run build" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"

    - name: Run tests
      if: ${{ inputs.run-tests == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        cmd="${{ inputs.test-command }}"
        if [ -z "${cmd}" ]; then
          case "${{ inputs.package-manager }}" in
            pnpm) cmd="pnpm run test:ci" ;;
            yarn) cmd="yarn run test:ci" ;;
            *) cmd="npm run test:ci" ;;
          esac
        fi
        echo "Running: ${cmd}"
        eval "${cmd}"

    - name: Upload test results artifact
      if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ${{ inputs.working-directory }}/test-results/junit.xml
        if-no-files-found: warn

    - name: Upload coverage artifact
      if: ${{ inputs.upload-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: ${{ inputs.working-directory }}/coverage/
        if-no-files-found: warn

    - name: Publish test results
      if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: dorny/test-reporter@v1
      with:
        name: Test Results
        path: ${{ inputs.working-directory }}/test-results/junit.xml
        reporter: jest-junit
        fail-on-error: false

    - name: Publish coverage summary
      if: ${{ inputs.publish-results == 'true' && (success() || failure()) }}
      continue-on-error: true
      uses: irongut/CodeCoverageSummary@v1.3.0
      with:
        filename: ${{ inputs.working-directory }}/coverage/cobertura-coverage.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both
