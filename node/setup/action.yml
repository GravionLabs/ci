name: 'Setup Node.js'
description: 'Sets up Node.js with cache and package manager'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 20, 22)'
    required: false
    default: '24'
  package-manager:
    description: 'Package manager to use (npm, pnpm, yarn)'
    required: false
    default: 'npm'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}

    - name: Enable package manager
      shell: bash
      run: |
        echo "Enabling package manager: ${{ inputs.package-manager }}"
        case "${{ inputs.package-manager }}" in
          pnpm) npm install -g pnpm ;;
        esac
