name: 'Setup Node.js'
description: 'Sets up Node.js with cache and package manager'

inputs:
  node-version:
    description: 'Version of Node.js to use (e.g. 24, 26)'
    required: false
    default: '26'
  package-manager:
    description: 'Package manager to use (npm, pnpm, yarn)'
    required: false
    default: 'npm'
  package-manager-version:
    description: 'Version of the package manager to install (e.g. pnpm 11.6.0). Leave empty to auto-detect from the packageManager field in package.json.'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      if: ${{ inputs.package-manager == 'pnpm' && inputs.package-manager-version != '' }}
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      with:
        version: ${{ inputs.package-manager-version }}

    - name: Setup pnpm (auto-detect)
      if: ${{ inputs.package-manager == 'pnpm' && inputs.package-manager-version == '' }}
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
